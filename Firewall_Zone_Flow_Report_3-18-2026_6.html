<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Segoe UI',Arial,sans-serif;background:#1a1a2e;color:#e0e0e0;height:100vh;display:flex;flex-direction:column;overflow:hidden}
#hdr{background:#0a0a18;padding:8px 16px;display:flex;align-items:center;gap:14px;border-bottom:2px solid #7ecfff33;flex-shrink:0}
#hdr h1{font-size:14px;font-weight:700;color:#7ecfff;white-space:nowrap}
.stat{font-size:11px;color:#888}.stat b{color:#7ecfff}
#err{display:none;background:#7f1d1d;color:#fca5a5;padding:5px 14px;font-size:12px;border-bottom:1px solid #991b1b;flex-shrink:0}
#main{display:flex;flex:1;overflow:hidden}
#c1{flex-basis:320px;flex-shrink:0;flex-grow:0;border-right:none;display:flex;flex-direction:column;overflow:hidden;min-width:180px;max-width:700px}
#c2{flex-basis:320px;flex-shrink:0;flex-grow:0;border-right:none;display:flex;flex-direction:column;overflow:hidden;min-width:200px;max-width:600px}
#c3{flex:1;display:flex;flex-direction:column;overflow:hidden;min-width:0}
.col-hdr{background:#0d1020;padding:7px 10px;border-bottom:1px solid #2a2a3e;flex-shrink:0}
.col-hdr h2{font-size:10px;font-weight:700;color:#7ecfff;text-transform:uppercase;letter-spacing:.06em;margin-bottom:4px}
#mapwrap{position:relative;background:#080c18;flex-shrink:0}
#mapwrap canvas{display:block}

canvas{display:block}
#resetBtn{position:absolute;top:5px;right:5px;background:#1a2035;border:1px solid #3a4060;color:#aaa;font-size:10px;padding:2px 7px;cursor:pointer;border-radius:3px}
#resetBtn:hover{background:#2a3050}
#zlist{overflow-y:auto;flex:1;padding:4px 8px}
.zi{padding:4px 7px;margin:1px 0;border-radius:3px;cursor:pointer;font-size:11px;display:flex;align-items:center;gap:5px;border:1px solid transparent;transition:background .1s}
.zi:hover,.zi.on{background:#1a2840;border-color:#3a5070}
.zb{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.tabs{display:flex;gap:3px;margin-top:4px}
.tab{padding:2px 9px;font-size:11px;border:1px solid #2a2a3e;border-radius:3px;cursor:pointer;background:#080c18;color:#888}
.tab.on{background:#1a3050;border-color:#3a6090;color:#7ecfff}
#srch{width:100%;margin-top:4px;padding:3px 7px;background:#080c18;border:1px solid #2a2a3e;color:#ccc;border-radius:3px;font-size:11px;outline:none}
#srch:focus{border-color:#3a6090}
#c2body{overflow-y:auto;flex:1;padding:3px}
.rc{padding:6px 8px;margin:2px 0;border-radius:4px;cursor:pointer;border-left:3px solid;background:#0d1020;transition:background .1s}
.rc:hover{background:#141828}.rc.on{background:#1a3050}
.rc.a{border-color:#22c55e}.rc.d{border-color:#ef4444}
.rn{font-size:11px;font-weight:600;color:#ddd;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rm{font-size:10px;color:#666;margin-top:1px}
#c3body{overflow-y:auto;flex:1;padding:8px 12px}
.sec{margin-bottom:12px}
.sec-h{font-size:9px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:#7ecfff;padding:3px 0;border-bottom:1px solid #1e2840;margin-bottom:5px}
.ic{display:flex;align-items:flex-start;padding:4px 7px;margin:2px 0;border-radius:3px;border-left:3px solid;background:#0b1020;font-size:11px;gap:7px}
.ia{font-family:monospace;font-size:11px;font-weight:600;word-break:break-all}
.im{color:#888;font-size:10px;line-height:1.4;margin-top:1px}
.ic.int{border-color:#22c55e}.ic.low{border-color:#60a5fa}.ic.med{border-color:#f59e0b}.ic.high{border-color:#ef4444}.ic.blk{border-color:#a855f7}.ic.ok{border-color:#34d399}.ic.wc{border-color:#f59e0b;background:#120f00}.ic.geo{border-color:#8b0000;background:#120000}
.rb{font-size:9px;padding:1px 5px;border-radius:8px;font-weight:700;white-space:nowrap;flex-shrink:0;margin-top:1px}
.rb.H{background:#7f1d1d;color:#fca5a5}.rb.M{background:#78350f;color:#fcd34d}.rb.L{background:#1e3a5f;color:#93c5fd}.rb.A{background:#064e3b;color:#6ee7b7}.rb.B{background:#3b0764;color:#d8b4fe}.rb.I{background:#14532d;color:#86efac}
.lkbtn{background:#1a3050;border:1px solid #3a6090;color:#7ecfff;font-size:9px;padding:2px 6px;border-radius:3px;cursor:pointer;margin-top:3px}
.lkbtn:hover{background:#1e4060}
.lkres{font-size:10px;color:#888;margin-top:2px}
.empty{color:#444;font-size:12px;padding:16px;text-align:center}

.vsplit{width:5px;flex-shrink:0;background:#1a1a2e;cursor:col-resize;position:relative;z-index:10;transition:background .15s}
.vsplit:hover,.vsplit.dragging{background:#3a6090}
.vsplit::after{content:"";position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:1px;height:40px;background:#3a4060;border-radius:1px;box-shadow:2px 0 0 #3a4060,-2px 0 0 #3a4060}
</style>
</head>

<script>
(function(){

var FL = [], curFlows = [], curTab = 'a', curRule = null;
var selZone = null, selFlow = null;
var mapW = 300, mapH = 440, mapOX = 0, mapOY = 0, mapS = 1;

// ---- Load data ----

  "outside_untrusted":{x:28,y:344,w:82,h:26,c:"#2a1a3a",f:"#f5e8ff",if_:"eth1/1"},
  "landing_trusted": {x:430,y:248,w:82,h:26,c:"#1a3a2a",f:"#e8fff5",if_:"eth1/2"},
  "inside_trusted":  {x:430,y:280,w:82,h:26,c:"#1a2a3a",f:"#e8f5ff",if_:"eth1/2"}
};

var usedZ = {};
for (var fi = 0; fi < FL.length; fi++) { usedZ[FL[fi].from] = 1; usedZ[FL[fi].to] = 1; }

// ---- Canvas setup ----
var mc = document.getElementById("mc");
var ctx = mc.getContext("2d");

function resizeMap() {
  var w = document.getElementById("c1").clientWidth || 320;
  mapW = w; mapH = 440;
  mc.width = mapW * devicePixelRatio;
  mc.height = mapH * devicePixelRatio;
  mc.style.width = mapW + "px";
  mc.style.height = mapH + "px";
  ctx.setTransform(devicePixelRatio, 0, 0, devicePixelRatio, 0, 0);
  drawMap();
}

function rr(cx, x, y, w, h, r) {
  cx.beginPath();
  cx.moveTo(x+r,y); cx.lineTo(x+w-r,y); cx.arcTo(x+w,y,x+w,y+r,r);
  cx.lineTo(x+w,y+h-r); cx.arcTo(x+w,y+h,x+w-r,y+h,r);
  cx.lineTo(x+r,y+h); cx.arcTo(x,y+h,x,y+h-r,r);
  cx.lineTo(x,y+r); cx.arcTo(x,y,x+r,y,r);
  cx.closePath(); cx.fill(); cx.stroke();
}

function arrow(cx, x1,y1, x2,y2, col, lw, off) {
  var dx=x2-x1, dy=y2-y1, len=Math.sqrt(dx*dx+dy*dy);
  if (len < 2) return;
  var nx=-dy/len, ny=dx/len;
  var sx=x1+nx*off, sy=y1+ny*off, ex=x2+nx*off, ey=y2+ny*off;
  cx.save();
  cx.strokeStyle=col; cx.lineWidth=lw; cx.globalAlpha=0.8;
  cx.beginPath(); cx.moveTo(sx,sy); cx.lineTo(ex,ey); cx.stroke();
  var a=Math.atan2(ey-sy,ex-sx), al=9, aw=0.4;
  cx.beginPath();
  cx.moveTo(ex,ey);
  cx.lineTo(ex-al*Math.cos(a-aw),ey-al*Math.sin(a-aw));
  cx.lineTo(ex-al*Math.cos(a+aw),ey-al*Math.sin(a+aw));
  cx.closePath(); cx.fillStyle=col; cx.fill();
  cx.restore();
}

function drawMap() {
  if (!mapW || !mapH) return;
  ctx.clearRect(0,0,mapW,mapH);
  ctx.save();
  ctx.translate(mapOX,mapOY); ctx.scale(mapS,mapS);

  var offs = {}, offIdx = {}, offCnt = {};
  for (var i=0;i<FL.length;i++) {
    var f=FL[i], k=[f.from,f.to].sort().join("|");
    offCnt[k] = (offCnt[k]||0)+1;
  }
  for (var i=0;i<FL.length;i++) {
    var f=FL[i];
    if (!ZP[f.from]||!ZP[f.to]) continue;
    var fp=ZP[f.from], tp=ZP[f.to];
    var na=(f.a||[]).length, nd=(f.d||[]).length;
    var lw = Math.min(1+Math.sqrt((na+nd)/6),5);
    var col = na>0&&nd>0 ? "#f59e0b" : na>0 ? "#22c55e" : "#ef4444";
    var dim = (selZone && f.from!==selZone && f.to!==selZone) ||
              (selFlow && (f.from+"|"+f.to)!==selFlow);
    if (dim) { lw=0.4; col="#2a2a40"; }
    var k=[f.from,f.to].sort().join("|");
    if (!offIdx[k]) offIdx[k]=0;
    var off = (offIdx[k] - (offCnt[k]-1)/2) * 13;
    offIdx[k]++;
    var cx1=fp.x+fp.w/2, cy1=fp.y+fp.h/2, cx2=tp.x+tp.w/2, cy2=tp.y+tp.h/2;
    arrow(ctx,cx1,cy1,cx2,cy2,col,lw,off);
    if (!dim) {
      var dl=Math.sqrt((cx2-cx1)*(cx2-cx1)+(cy2-cy1)*(cy2-cy1))||1;
      var bx=(cx1+cx2)/2+(-cy2+cy1)/dl*off;
      var by=(cy1+cy2)/2+(cx2-cx1)/dl*off;
      ctx.save();
      ctx.beginPath(); ctx.arc(bx,by,8,0,2*Math.PI);
      ctx.fillStyle="#0d1020"; ctx.fill();
      ctx.strokeStyle=col; ctx.lineWidth=1; ctx.stroke();
      ctx.fillStyle="#fff"; ctx.font="bold 7px Arial"; ctx.textAlign="center"; ctx.textBaseline="middle";
      var t=na+nd; ctx.fillText(t>99?"99+":String(t),bx,by);
      ctx.restore();
    }
  }

  for (var zn in ZP) {
    if (!usedZ[zn]) continue;
    var zp=ZP[zn], isSel=(selZone===zn);
    ctx.save();
    ctx.globalAlpha = isSel ? 1 : 0.82;
    ctx.fillStyle=zp.c; ctx.strokeStyle=isSel?"#7ecfff":"#444"; ctx.lineWidth=isSel?2:1;
    rr(ctx,zp.x,zp.y,zp.w,zp.h,4);
    ctx.fillStyle="#fff"; ctx.textAlign="center"; ctx.textBaseline="middle";
    ctx.font="bold 9px Arial";
    var lbl=zn.length>11?zn.substring(0,10)+"\u2026":zn;
    ctx.fillText(lbl,zp.x+zp.w/2,zp.y+zp.h/2-4);
    ctx.font="7px Arial"; ctx.fillStyle="rgba(255,255,255,0.5)";
    ctx.fillText(zp.if_,zp.x+zp.w/2,zp.y+zp.h/2+5);
    ctx.restore();
  }
  ctx.restore();
}

mc.addEventListener("mousedown",function(e){isDrag=true;dSX=e.clientX;dSY=e.clientY;dOX=mapOX;dOY=mapOY;});
mc.addEventListener("mousemove",function(e){if(!isDrag)return;mapOX=dOX+(e.clientX-dSX);mapOY=dOY+(e.clientY-dSY);drawMap();});
mc.addEventListener("mouseup",function(e){
  if(Math.abs(e.clientX-dSX)<4&&Math.abs(e.clientY-dSY)<4) clickMap(e);
  isDrag=false;
});
mc.addEventListener("wheel",function(e){
  e.preventDefault();
  var f=e.deltaY<0?1.1:0.9;
  var r=mc.getBoundingClientRect();
  var mx=e.clientX-r.left,my=e.clientY-r.top;
  mapOX=mx-(mx-mapOX)*f; mapOY=my-(my-mapOY)*f; mapS*=f; drawMap();
},{passive:false});

function clickMap(e) {
  var r=mc.getBoundingClientRect();
  var mx=(e.clientX-r.left-mapOX)/mapS, my=(e.clientY-r.top-mapOY)/mapS;
  for (var zn in ZP) {
    if (!usedZ[zn]) continue;
    var z=ZP[zn];
    if(mx>=z.x&&mx<=z.x+z.w&&my>=z.y&&my<=z.y+z.h){doSelZone(zn);return;}
  }
}

function resetMap(){selZone=null;selFlow=null;mapOX=0;mapOY=0;mapS=1;showAll();drawMap();}

// ---- Zone list ----
function buildZoneList() {
  var zl=document.getElementById("zlist"),html="",names=[];
  for (var z in usedZ) names.push(z);
  names.sort();
  html='<div class="zi" onclick="showAll()" style="font-size:10px;color:#555;border-color:transparent">&#8593; Show all flows</div>';
  for (var i=0;i<names.length;i++) {
    var z=names[i], zp=ZP[z], col=zp?zp.c:"#555";
    var na=0,nd=0;
    for(var fi=0;fi<FL.length;fi++){if(FL[fi].from===z||FL[fi].to===z){na+=(FL[fi].a||[]).length;nd+=(FL[fi].d||[]).length;}}
    // Use data-z attribute to avoid string escaping issues in onclick
    html+='<div class="zi" data-z="'+hesc(z)+'" onclick="doSelZone(this.dataset.z)">';
    html+='<div class="zb" style="background:'+col+'"></div>';
    html+='<span style="flex:1">'+hesc(z)+'</span>';
    html+='<span style="font-size:9px;color:#555">'+na+'a '+nd+'d</span>';
    html+='</div>';
  }
  zl.innerHTML=html;
}

// ---- Selection ----
function flatten(fArr) {
  var out=[];
  for(var i=0;i<fArr.length;i++){
    var f=fArr[i];
    var a=f.a||[], d=f.d||[];
    for(var j=0;j<a.length;j++){a[j]._fz=f.from;a[j]._tz=f.to;a[j]._act="a";out.push(a[j]);}
    for(var j=0;j<d.length;j++){d[j]._fz=f.from;d[j]._tz=f.to;d[j]._act="d";out.push(d[j]);}
  }
  return out;
}

function showAll(){
  selZone=null;selFlow=null;curRule=null;
  curFlows=flatten(FL);
  document.getElementById("c2t").textContent="All Rules";
  renderRules();drawMap();
  highlightZI(null);
}

function doSelZone(name){
  selZone=name;selFlow=null;curRule=null;
  var fArr=[];
  for(var i=0;i<FL.length;i++){if(FL[i].from===name||FL[i].to===name)fArr.push(FL[i]);}
  curFlows=flatten(fArr);
  document.getElementById("c2t").textContent="Zone: "+name;
  renderRules();drawMap();
  highlightZI(name);
}

function highlightZI(name){
  var items=document.querySelectorAll(".zi");
  for(var i=0;i<items.length;i++){
    items[i].classList.toggle("on", items[i].dataset.z===name);
  }
}

// ---- Rule rendering ----
function setTab(t){
  curTab=t;
  document.getElementById("tA").className="tab"+(t==="a"?" on":"");
  document.getElementById("tD").className="tab"+(t==="d"?" on":"");
  renderRules();
}

var _filtered=[];
function renderRules(){
  var q=document.getElementById("srch").value.toLowerCase();
  var show=[];
  var na=0,nd=0;
  for(var i=0;i<curFlows.length;i++){
    var r=curFlows[i];
    if(r._act==="a")na++;else nd++;
    if(r._act!==curTab)continue;
    if(q&&r.n.toLowerCase().indexOf(q)<0&&(r.p||"").toLowerCase().indexOf(q)<0)continue;
    show.push(r);
  }
  document.getElementById("cA").textContent="("+na+")";
  document.getElementById("cD").textContent="("+nd+")";
  _filtered=show;
  var html="";
  if(!show.length) html='<div class="empty">No rules to display</div>';
  for(var i=0;i<show.length;i++){
    var r=show[i];
    var cls="rc "+(r._act==="a"?"a":"d");
    var sel=curRule&&curRule._uid===r._uid?" on":"";
    html+='<div class="'+cls+sel+'" data-i="'+i+'" onclick="doSelRule(+this.dataset.i)">';
    html+='<div class="rn">'+hesc(r.n)+'</div>';
    html+='<div class="rm">'+hesc(r._fz)+" \u2192 "+hesc(r._tz)+" &nbsp;|&nbsp; "+hesc((r.p||"any").substring(0,50))+'</div>';
    html+='</div>';
  }
  document.getElementById("c2body").innerHTML=html;
}

function doSelRule(idx){
  var r=_filtered[idx];
  if(!r)return;
  r._uid=r._uid||(r._fz+r._tz+r.i);
  curRule=r;
  renderRules();
  showDetail(r);
}

// ---- IP detail ----
function showDetail(r){
  document.getElementById("c3t").textContent=r.n;
  var h="";
  h+='<div class="sec"><div class="sec-h">Source Addresses</div>';
  var se=r.se||[];
  if(!se.length)h+='<div class="empty" style="padding:5px">any / not specified</div>';
  for(var i=0;i<se.length;i++)h+=ipCard(se[i]);
  h+='</div>';
  h+='<div class="sec"><div class="sec-h">Destination Addresses</div>';
  var de=r.de||[];
  if(!de.length)h+='<div class="empty" style="padding:5px">any / not specified</div>';
  for(var i=0;i<de.length;i++)h+=ipCard(de[i]);
  h+='</div>';
  document.getElementById("c3body").innerHTML=h;
}

function ipCard(e){
  var ip=e.ip||"?";
  if(ip==="any")return'<div class="ic wc"><div><div class="ia">&#11088; ANY</div><div class="im">Wildcard &mdash; matches all addresses</div></div></div>';
  if(e.geo)return'<div class="ic geo"><div><div class="ia">&#127757; '+hesc(ip)+'</div><div class="im">GEO Block: '+hesc(e.country||ip)+'</div></div></div>';
  if(e.nt==="Internal"||e.s){
    return'<div class="ic int"><span class="rb I">INT</span><div><div class="ia">'+hesc(ip)+'</div><div class="im">'+hesc(e.s||"Internal")+(e.nt?" &middot; "+hesc(e.nt):"")+'</div></div></div>';
  }
  var risk=e.risk||"MED";
  var emoji={"HIGH":"&#128308;","MED":"&#128992;","LOW":"&#128994;","ALLOW":"&#9989;","BLOCKED":"&#128683;"}[risk]||"&#9898;";
  var rc={"HIGH":"high","MED":"med","LOW":"low","ALLOW":"ok","BLOCKED":"blk"}[risk]||"med";
  var rb={"HIGH":"H","MED":"M","LOW":"L","ALLOW":"A","BLOCKED":"B"}[risk]||"M";
  var lk="";
  if(e.org==="Unknown External"){
    var cid="lk"+ip.replace(/[^0-9a-z]/gi,"_");
    // Use data attribute to avoid any string escaping issues
    lk='<br><button class="lkbtn" data-ip="'+hesc(ip)+'" onclick="lkup(this)">&#128269; Lookup ARIN/RIPE</button><div class="lkres" id="'+hesc(cid)+'"></div>';
  }
  return'<div class="ic '+rc+'"><span class="rb '+rb+'">'+emoji+' '+risk+'</span><div><div class="ia">'+hesc(ip)+'</div><div class="im">'+hesc(e.org||"")+(e.typ?" &middot; "+hesc(e.typ):"")+(e.cc?" &middot; "+hesc(e.cc):"")+lk+'</div></div></div>';
}

function lkup(btn){
  var ip=btn.dataset.ip;
  var cid="lk"+ip.replace(/[^0-9a-z]/gi,"_");
  var res=document.getElementById(cid);
  if(!res)return;
  btn.style.display="none";
  res.innerHTML='<i style="color:#666;font-size:10px">Querying ARIN&hellip;</i>';
  var base=ip.split("/")[0].split("-")[0];
  fetch("https://rdap.arin.net/registry/ip/"+base)
    .then(function(r){return r.json();})
    .then(function(d){res.innerHTML='<span style="color:#6ee7b7">'+hesc(d.name||"Found")+'</span>';})
    .catch(function(){
      fetch("https://api.hackertarget.com/aslookup/?q="+base)
        .then(function(r){return r.text();})
        .then(function(t){res.innerHTML='<span style="color:#6ee7b7">'+hesc(t.split("\n")[0])+'</span>';})
        .catch(function(){
          res.innerHTML='<a href="https://search.arin.net/rdap/#?query='+base+'" target="_blank" style="color:#7ecfff">Look up on ARIN &#8594;</a>';
        });
    });
}

// ---- Stats ----
function stats(){
  var ta=0,td=0,zz={};
  for(var i=0;i<FL.length;i++){var f=FL[i];ta+=(f.a||[]).length;td+=(f.d||[]).length;zz[f.from]=1;zz[f.to]=1;}
  document.getElementById("sT").textContent=ta+td;
  document.getElementById("sA").textContent=ta;
  document.getElementById("sD").textContent=td;
  document.getElementById("sZ").textContent=Object.keys(zz).length;
  document.getElementById("sF").textContent=FL.length;
}

// ---- Utility ----
function hesc(s){
  if(!s)return"";
  return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#39;");
}

// ---- Fit all zones into view ----
function fitAll() {
  var minX=9999,minY=9999,maxX=0,maxY=0,found=false;
  for (var zn in ZP) {
    if (!usedZ[zn]) continue;
    var z=ZP[zn];
    minX=Math.min(minX,z.x); minY=Math.min(minY,z.y);
    maxX=Math.max(maxX,z.x+z.w); maxY=Math.max(maxY,z.y+z.h);
    found=true;
  }
  if (!found) return;
  var pad=24;
  var scaleX=(mapW-pad*2)/(maxX-minX);
  var scaleY=(mapH-pad*2)/(maxY-minY);
  mapS=Math.min(scaleX,scaleY,1.4);
  mapOX=pad-minX*mapS+(mapW-pad*2-(maxX-minX)*mapS)/2;
  mapOY=pad-minY*mapS+(mapH-pad*2-(maxY-minY)*mapS)/2;
  drawMap();
}

// ---- Map height slider ----
function setMapH(h) {
  document.getElementById("mapwrap").style.height = h + "px";
  document.getElementById("mhVal").textContent = h;
  mapH = h;
  resizeMap();
  fitAll();
}

// ---- Column splitter drag ----
(function(){
  function makeSplitter(splitterId, colId, onResize) {
    var sp = document.getElementById(splitterId);
    var col = document.getElementById(colId);
    if (!sp || !col) return;
    var dragging = false, startX, startW;
    sp.addEventListener("mousedown", function(e) {
      dragging = true;
      startX = e.clientX;
      startW = col.getBoundingClientRect().width;
      sp.classList.add("dragging");
      document.body.style.cursor = "col-resize";
      document.body.style.userSelect = "none";
      e.preventDefault();
    });
    document.addEventListener("mousemove", function(e) {
      if (!dragging) return;
      var newW = Math.max(180, Math.min(startW + (e.clientX - startX), 700));
      col.style.flexBasis = newW + "px";
      if (onResize) onResize(newW);
    });
    document.addEventListener("mouseup", function() {
      if (!dragging) return;
      dragging = false;
      sp.classList.remove("dragging");
      document.body.style.cursor = "";
      document.body.style.userSelect = "";
      // Redraw map after c1 resize
      if (splitterId === "sp1") { resizeMap(); }
    });
  }
  makeSplitter("sp1", "c1", null);
  makeSplitter("sp2", "c2", null);
})();

// ---- Expose to window (needed for inline onclick attributes) ----
window.showAll    = showAll;
window.fitAll     = fitAll;
window.setMapH    = setMapH;
window.doSelZone  = doSelZone;
window.doSelRule  = doSelRule;
window.setTab     = setTab;
window.resetMap   = resetMap;
window.lkup       = lkup;

// ---- Init ----
stats();
resizeMap();
fitAll();
buildZoneList();
showAll();
window.addEventListener("resize", function(){ resizeMap(); fitAll(); });

})();
</script>
